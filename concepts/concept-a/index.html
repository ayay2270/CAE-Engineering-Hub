<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split-pane explorer · CAE Engineering Hub</title>
  <meta name="description" content="Browse CAE tools in a list and inspect the selected tool without leaving the Hub.">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="a.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#tool-list">Skip to tool list</a>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <p class="product">CAE Engineering Hub</p>
        <h1>Tool explorer</h1>
      </div>
      <form class="search" role="search" onsubmit="event.preventDefault()">
        <label for="tool-search">Search tools</label>
        <input id="tool-search" type="search" placeholder="Name, purpose, or tag" autocomplete="off" enterkeyhint="search">
      </form>
      <a class="concepts" href="../index.html">All concepts</a>
    </header>
    <div class="panes">
      <section class="list-pane" aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title">Tools</h2>
          <p id="list-count">Loading tools</p>
        </div>
        <div id="tool-list" role="listbox" aria-label="Engineering tools" aria-activedescendant=""></div>
      </section>
      <section class="detail" id="detail" aria-labelledby="detail-title" tabindex="-1"></section>
    </div>
  </div>
  <p id="live" class="sr-only" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">Enable JavaScript to load the tool explorer.</p></noscript>
</body>
</html>
