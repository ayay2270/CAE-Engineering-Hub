<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="CAE 與工程工具入口：材料、知識、分析流程、工程計算及日常工具。">
  <title>HOME · CAE Engineering Hub</title>
  <link rel="icon" href="assets/icons/hub.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/hub.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳至工具列表</a>
  <header class="topbar">
    <a class="brand" href="#home"><img src="assets/icons/hub.svg" width="36" height="36" alt=""><span>CAE Engineering Hub<small>工程工具入口</small></span></a>
    <a class="github-link" href="https://github.com/ayay2270?tab=repositories" target="_blank" rel="noopener noreferrer">GitHub <span>/ ayay2270</span><span data-icon="external"></span></a>
  </header>
  <div class="app-layout">
    <aside class="sidebar" aria-label="工具導覽">
      <nav aria-label="主要導覽"><p class="nav-label">工作空間</p><div id="main-navigation" class="nav-group"></div><p class="nav-label">工具分類</p><div id="category-navigation" class="nav-group"></div><p class="nav-label">我的工具</p><div id="personal-navigation" class="nav-group"></div></nav>
      <div class="sidebar-note"><span data-icon="shield"></span><strong>各自獨立，一處直達</strong><p>工具於新分頁開啟。<br>收藏與最近使用僅存於此瀏覽器。</p></div>
    </aside>
    <main id="workspace" tabindex="-1">
      <div class="breadcrumb">工作空間<span>/</span><span id="breadcrumb-current">HOME</span></div>
      <section class="intro" aria-labelledby="page-title"><div><p class="eyebrow">CAE / ENGINEERING / UTILITIES</p><h1 id="page-title">Engineering Tools</h1><p id="page-description">從材料與分析，到工程計算。找到工具，開始工作。</p></div><div class="directory-stat"><strong>12</strong><span>工具目錄<small>11 個線上 · 1 個本機</small></span></div></section>
      <section class="collection" aria-label="搜尋與工具列表">
        <form class="toolbar" role="search" onsubmit="return false">
          <div class="search-wrap"><span data-icon="search"></span><label class="sr-only" for="tool-search">搜尋工具</label><input id="tool-search" type="search" placeholder="搜尋工具、用途或關鍵字…" autocomplete="off"><kbd id="search-shortcut">Ctrl K</kbd></div>
          <div class="filter-field"><label for="status-filter">使用方式</label><select id="status-filter"><option value="">全部</option><option value="online">線上工具</option><option value="local">本機工具</option></select></div>
          <button id="clear-filters" class="text-button" type="button">清除篩選</button>
        </form>
        <div class="collection-meta"><span id="tool-count" role="status" aria-live="polite" aria-atomic="true">正在載入工具…</span><span>點選星號收藏常用工具</span></div>
        <div id="tool-groups" aria-busy="true"></div>
        <div id="empty-state" class="empty-state" hidden><span data-icon="search"></span><h2 id="empty-title"></h2><p id="empty-description"></p><button id="empty-reset" class="secondary-button" type="button">清除篩選</button></div>
      </section>
      <footer><span>CAE Engineering Hub <span class="footer-divider">/</span> ayay2270</span><span>網址檢查：2026.10.27 · 狀態為盤點快照</span></footer>
      <noscript><p>請啟用 JavaScript 以顯示工具目錄。<a href="https://github.com/ayay2270/CAE-Engineering-Hub/blob/main/INVENTORY.md">查看完整工具清單</a></p></noscript>
    </main>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
